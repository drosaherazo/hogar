services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hogar
      POSTGRES_PASSWORD: hogar
      POSTGRES_DB: hogar
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hogar -d hogar"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  db-data:
