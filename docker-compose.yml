# One project name for every worktree, so they all share the same Postgres and Mailpit.
name: hogarapp

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hogar
      POSTGRES_PASSWORD: hogar
      POSTGRES_DB: hogar
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hogar -d hogar"]
      interval: 2s
      timeout: 5s
      retries: 20

  # Local inbox for sign-in emails: the API sends through its HTTP API (MAILPIT_URL) and you read
  # them at http://localhost:8025. Nothing leaves your machine.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  db-data:
