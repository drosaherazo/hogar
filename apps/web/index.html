<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbf8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141016" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Hogar</title>
    <script>
      // Apply the theme before the first paint so the page never flashes the wrong colors.
      // Keep in sync with src/theme/theme.ts.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("hogar-theme");
        } catch (error) {}
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        // The browser bar follows the same choice (THEME_COLORS in src/theme/theme.ts).
        var barColor = theme === "dark" ? "#141016" : "#fbf8fa";
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
          meta.setAttribute("content", barColor);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
